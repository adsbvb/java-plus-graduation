server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # Админ: события, категории, подборки (event-service)
        - id: admin-event-service
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**, /admin/categories/**, /admin/compilations/**
          metadata:
            service: event-service

        # Админ: пользователи (user-service)
        - id: admin-user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
          metadata:
            service: user-service

        # Админ: комментарии (comment-service)
        - id: admin-comment-service
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments/**
          metadata:
            service: comment-service

        # Приватные: события (event-service)
        - id: private-event-service
          uri: lb://event-service
          predicates:
            - Path=/users/*/events/**
          metadata:
            service: event-service

        # Приватные: запросы на участие (request-service)
        - id: private-request-service
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests/**
          metadata:
            service: request-service

        # Приватные: комментарии (comment-service)
        - id: private-comment-service
          uri: lb://comment-service
          predicates:
            - Path=/users/*/events/*/comments/**
          metadata:
            service: comment-service

        # Публичные: события, категории, подборки (event-service)
        - id: public-event-service
          uri: lb://event-service
          predicates:
            - Path=/events/**, /categories/**, /compilations/**
          metadata:
            service: event-service

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route: DEBUG
    org.springframework.cloud.gateway.handler: DEBUG
    org.springframework.cloud.gateway.filter: DEBUG
    org.springframework.web.reactive: DEBUG

gateway:
  retry:
    enabled: true
    max-attempts: 3
    backoff:
      initial-interval: 100ms
      multiplier: 2
      max-interval: 1000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
      base-path: /actuator
  endpoint:
    health:
      enabled: true
      show-details: always
    gateway:
      enabled: true