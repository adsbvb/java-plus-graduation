server:
  port: 0

grpc:
  server:
    port: 0

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analyzer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
    listener:
      batch-listener: true
      concurrency: 1
      poll-timeout: 5000

  datasource:
    url: jdbc:postgresql://localhost:6543/analyzer
    username: username
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: always

kafka:
  topic:
    user-actions: stats.user-actions.v1
    similarity: stats.events-similarity.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      enabled: true

logging:
  level:
    ru.practicum: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG