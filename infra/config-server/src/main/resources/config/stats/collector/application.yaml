server:
  port: 0

grpc:
  server:
    port: 0

spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      retries: 3
      acks: all
      batch-size: 16384
      properties:
        linger.ms: 10

kafka:
  topic:
    user-actions: stats.user-actions.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      enabled: true

logging:
  level:
    ru.practicum: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    net.devh: DEBUG
    io.grpc: DEBUG
